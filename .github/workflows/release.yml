name: Release

on:
  push:
    branches: ['release/*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Debug GH_TOKEN
        run: |
          echo "DEBUG: checking GH_TOKEN environment variable"
          if [ -n "$GH_TOKEN" ]; then
            echo "GH_TOKEN is SET (length: ${#GH_TOKEN})"
            echo "GH_TOKEN prefix: ${GH_TOKEN:0:4}"
          else
            echo "GH_TOKEN is NOT SET or EMPTY"
          fi

      - name: Build and publish Electron
        run: npx electron-builder --publish always -w
        env:
          GH_TOKEN: ${{ secrets.GH_NEW_TOKEN }}
