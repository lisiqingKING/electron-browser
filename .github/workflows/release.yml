name: Release

on:
  push:
    branches: ['release/*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GH_NEW_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build subapp
        run: |
          git clone https://github.com/lisiqingKING/internal-app.git apps/app-temp
          cd apps/app-temp
          npm ci
          npm run build
          cd ../..
          xcopy /E /I /Y apps/app-temp/dist apps/internal-app/dist/

      - name: Build
        run: npm run build

      - name: Build and publish Electron
        run: npx electron-builder --publish always -w
